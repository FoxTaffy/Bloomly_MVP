server {
    listen 80;
    server_name bloomly.fun www.bloomly.fun;
    return 301 https://bloomly.fun$request_uri;
}

server {
    listen 443 ssl;
    server_name bloomly.fun www.bloomly.fun;

    ssl_certificate /etc/letsencrypt/live/bloomly.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bloomly.fun/privkey.pem;

    client_max_body_size 100m;
    include snippets/security-headers.conf;
    include snippets/bloomly-auth.conf;

    # Защита от флуда (зоны — в conf.d/ddos-protection.conf).
    # Лимит соединений щедрый: на одного пользователя приходятся SSE + WebSocket, несколько вкладок, NAT.
    limit_conn bl_conn 100;

    # /api/auth/ с лимитом зоны auth подключается из snippets/bloomly-auth.conf выше.

    location /api/ {
        limit_req zone=bl_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # WebSocket (wss://bloomly.fun/api/) — без этих заголовков апгрейд не проходит и даёт 404
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Долгоживущие соединения: WebSocket и SSE-уведомления не должны рваться по простою
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /s3/ {
        limit_req zone=bl_web burst=150 nodelay;
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $http_host;
    }

    # ── SEO: sitemap и страницы для краулеров ────────────────────────────────
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location ~ ^/sitemap-[a-z]+-[0-9]+\.xml$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location ~ ^/post/([^/]+)/?$ {
        limit_req zone=bl_web burst=100 nodelay;
        if ($seo_bot) {
            rewrite ^/post/([^/]+)/?$ /og/post/$1 break;
            proxy_pass http://127.0.0.1:8080;
        }
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/profile/([^/]+)/?$ {
        limit_req zone=bl_web burst=100 nodelay;
        if ($seo_bot) {
            rewrite ^/profile/([^/]+)/?$ /og/profile/$1 break;
            proxy_pass http://127.0.0.1:8080;
        }
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/groups/([^/]+)/?$ {
        limit_req zone=bl_web burst=100 nodelay;
        if ($seo_bot) {
            rewrite ^/groups/([^/]+)/?$ /og/group/$1 break;
            proxy_pass http://127.0.0.1:8080;
        }
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=bl_web burst=100 nodelay;
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
