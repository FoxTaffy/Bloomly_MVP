# /etc/nginx/conf.d/seo-bots.conf — http-контекст. Поисковые краулеры и боты-превьюшки получают
# HTML с контентом и мета-тегами (бэкенд /og/*) вместо пустой оболочки SPA.
map $http_user_agent $seo_bot {
    default 0;
    ~*(googlebot|bingbot|yandex|duckduckbot|baiduspider|applebot|facebookexternalhit|twitterbot|telegrambot|vkshare|discordbot|slackbot|whatsapp|linkedinbot|skypeuripreview|pinterest|embedly|mastodon) 1;
}
