# /etc/nginx/conf.d/ddos-protection.conf — http-контекст. Первый рубеж против флуда: отсекаем
# лишние запросы и медленные соединения до того, как они дойдут до Node/Postgres.
# Ключ — $binary_remote_addr. Если перед nginx поставят Cloudflare/другой CDN, сначала подключите
# ngx_http_realip_module (set_real_ip_from + real_ip_header), иначе лимитироваться будет IP прокси.

# ── Зоны лимитов запросов ────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=bl_api:20m  rate=30r/s;   # обычный API
limit_req_zone $binary_remote_addr zone=bl_web:20m  rate=40r/s;   # SPA, статика, /s3/ (много файлов за загрузку)

# ── Лимит одновременных соединений с одного IP ───────────────────────────────
limit_conn_zone $binary_remote_addr zone=bl_conn:20m;

# 429 вместо дефолтного 503 — клиенты и мониторинг отличают лимит от падения
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  warn;
limit_conn_log_level warn;

# ── Таймауты против slowloris и медленных POST ───────────────────────────────
client_header_timeout 15s;
client_body_timeout   60s;   # между чтениями, а не на весь аплоад — большие файлы не страдают
send_timeout          60s;
keepalive_timeout     30s;
keepalive_requests    1000;
reset_timedout_connection on;

# ── Размеры заголовков ───────────────────────────────────────────────────────
client_header_buffer_size   2k;
large_client_header_buffers 4 16k;
