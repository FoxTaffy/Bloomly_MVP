<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ─── Primary Meta ──────────────────────────────────────────────────── -->
    <title>Bloomly — Creative Social Network</title>
    <meta name="description" content="Bloomly is a creative social network for artists, the furry community, and creative people everywhere. Share art, connect, find your people." />
    <meta name="keywords" content="bloomly, furry, furry community, art, creative network, social network, artists, fursona, furry art" />
    <meta name="author" content="Bloomly" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bloomly.fun/" />

    <!-- ─── Open Graph ────────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bloomly" />
    <meta property="og:title" content="Bloomly — Creative Social Network" />
    <meta property="og:description" content="Bloomly is a creative social network for artists, the furry community, and creative people everywhere. Share art, connect, find your people." />
    <meta property="og:url" content="https://bloomly.fun/" />
    <meta property="og:image" content="https://bloomly.fun/banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bloomly — Creative Social Network" />
    <meta property="og:locale" content="en_US" />

    <!-- ─── Twitter Card ──────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@bloomlyfun" />
    <meta name="twitter:title" content="Bloomly — Creative Social Network" />
    <meta name="twitter:description" content="Bloomly is a creative social network for artists, the furry community, and creative people everywhere." />
    <meta name="twitter:image" content="https://bloomly.fun/banner.png" />

    <!-- ─── Favicon ───────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/bloomly.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/bloomly.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/bloomly.png" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="msapplication-TileColor" content="#7c3aed" />

    <!-- ─── Fonts (self-hosted, см. src/assets/fonts.css) ─────────────────── -->
    <link rel="preload" href="/fonts/nunito-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito-cyrillic-700-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- ─── JSON-LD: WebSite ──────────────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Bloomly",
      "url": "https://bloomly.fun",
      "description": "Bloomly is a creative social network for artists, the furry community, and creative people everywhere.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://bloomly.fun/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Bloomly",
        "url": "https://bloomly.fun",
        "logo": {
          "@type": "ImageObject",
          "url": "https://bloomly.fun/bloomly.png"
        }
      }
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
