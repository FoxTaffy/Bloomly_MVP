# Общие настройки для всех сервисов: ротация json-логов, чтобы логи запросов не забили диск,
# и `init` — корректная обработка сигналов и зомби-процессов (ffmpeg/sharp).
x-common: &common
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *common
    image: postgres:16-alpine
    restart: always
    mem_limit: 2g
    shm_size: '256mb'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-bloomly}
      # Tune PostgreSQL for stability under load
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=1GB
        -c effective_cache_size=4GB
        -c maintenance_work_mem=256MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c work_mem=16MB
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c tcp_keepalives_idle=60
        -c tcp_keepalives_interval=10
        -c tcp_keepalives_count=5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bloomly}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    <<: *common
    build: ./backend
    restart: always
    # Жёсткий потолок памяти: утечка или тяжёлая загрузка не должны положить весь хост.
    # max-old-space-size держим ниже mem_limit, чтобы V8 успевал собрать мусор до OOM-killer.
    mem_limit: 2g
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/api/auth/me',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      NODE_OPTIONS: "--max-old-space-size=1536"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?задайте MINIO_ROOT_PASSWORD в .env}
      MINIO_BUCKET: bloomly
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://bloomly.fun/s3}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://bloomly.fun}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-https://bloomly.fun/api}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Bloomly <noreply@bloomly.fun>}
      SUPPORT_EMAIL_ADDRESS: ${SUPPORT_EMAIL_ADDRESS:-}
      SUPPORT_IMAP_HOST: ${SUPPORT_IMAP_HOST:-}
      SUPPORT_IMAP_PORT: ${SUPPORT_IMAP_PORT:-1143}
      SUPPORT_IMAP_USER: ${SUPPORT_IMAP_USER:-}
      SUPPORT_IMAP_PASS: ${SUPPORT_IMAP_PASS:-}
      SUPPORT_SMTP_HOST: ${SUPPORT_SMTP_HOST:-}
      SUPPORT_SMTP_PORT: ${SUPPORT_SMTP_PORT:-1025}
      SUPPORT_SMTP_USER: ${SUPPORT_SMTP_USER:-}
      SUPPORT_SMTP_PASS: ${SUPPORT_SMTP_PASS:-}
    command: sh -c "npx prisma migrate deploy && npm run start"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    <<: *common
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    mem_limit: 128m
    ports:
      - "127.0.0.1:5173:3000"
    environment:
      - VITE_API_URL=https://bloomly.fun

  minio:
    <<: *common
    image: pgsty/minio
    container_name: bloomly-minio
    mem_limit: 1g
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?задайте MINIO_ROOT_PASSWORD в .env}
      MINIO_BROWSER_REDIRECT_URL: https://bloomly.fun/minio-console
    command: server /data --console-address ":9001"
    restart: always

volumes:
  postgres_data:
  minio_data:
