# Host nginx: /etc/nginx/sites-available/bloomly (симлинк из sites-enabled).
# Снимки сниппетов лежат рядом: snippets/bloomly-auth.conf, snippets/security-headers.conf.
# Отличие от прежней версии — только раздел «Файлы /s3/» (закрытые файлы по прямым ссылкам).
# Порядок выкладки и проверка — deploy/nginx/README.md.

server {
    listen 80;
    server_name bloomly.fun www.bloomly.fun;
    return 301 https://bloomly.fun$request_uri;
}

server {
    listen 443 ssl;
    server_name bloomly.fun www.bloomly.fun;

    ssl_certificate /etc/letsencrypt/live/bloomly.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bloomly.fun/privkey.pem;

    client_max_body_size 100m;
    include snippets/security-headers.conf;
    include snippets/bloomly-auth.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # WebSocket (wss://bloomly.fun/api/) — без этих заголовков апгрейд не проходит и даёт 404
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Долгоживущие соединения: WebSocket и SSE-уведомления не должны рваться по простою
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── Файлы /s3/ ──────────────────────────────────────────────────────────
    # MinIO слушает только 127.0.0.1:9000; наружу файлы отдаёт только этот сервер.
    # Наружу — только чтение объектов бакета: без листинга, записи и S3-API.

    # Закрытые документы (жалобы, верификация, поддержка) — только через /api/media/private
    location ^~ /s3/bloomly/private/ {
        return 404;
    }

    # Посты, комментарии, вложения переписки: перед отдачей API проверяет права зрителя
    # (cookie bloomly_media у веба, Bearer у мобильного клиента). Ответ зависит от зрителя,
    # поэтому Cache-Control: private — Cloudflare и другие общие кэши его не сохраняют.
    location ~ ^/s3/bloomly/(posts|comments|messages)/ {
        limit_except GET HEAD { deny all; }
        auth_request /_media_authz;
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host 127.0.0.1:9000;
        # Cookie и Authorization в MinIO не нужны
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        include snippets/security-headers.conf;
        add_header Cache-Control "private, max-age=300" always;
        add_header Vary "Cookie, Authorization" always;
    }

    location = /_media_authz {
        internal;
        proxy_pass http://127.0.0.1:8080/api/media/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Оформление (аватары, баннеры, фоны, стикеры, рамки) — публично, кэшируется как раньше
    location ~ ^/s3/bloomly/[a-z-]+/ {
        limit_except GET HEAD { deny all; }
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host 127.0.0.1:9000;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
    }

    # Всё прочее под /s3/ (корень бакета, листинг, другие бакеты, S3-запросы) — нет
    location /s3/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
