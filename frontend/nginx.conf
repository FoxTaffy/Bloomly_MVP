server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets (assets/*-<hash>.js/css/...) never change content under the
  # same filename — safe to cache "forever" on the client.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html must always be revalidated — it's the only thing that references the
  # current hashed asset filenames, so caching it stale is what causes users to keep
  # seeing an old deploy after a rebuild.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
