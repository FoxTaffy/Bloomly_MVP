server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # Версия nginx не раскрывается в заголовках ответа.
  server_tokens off;

  # Заголовки повторяются в каждом location: nginx отменяет add_header уровня server,
  # если в location есть свой add_header.
  # script-src 'self' — единственная защита, которая не даёт выполнить javascript:-ссылку или
  # внедрённый скрипт, даже если где-то пропустили небезопасный href (defence in depth).
  # style-src 'unsafe-inline' нужен Vue (style=""), шрифты (Nunito) лежат в /fonts/ и отдаются с того же домена.

  # Hashed build assets (assets/*-<hash>.js/css/...) never change content under the
  # same filename — safe to cache "forever" on the client.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://yookassa.ru; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' https://yookassa.ru; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # index.html must always be revalidated — it's the only thing that references the
  # current hashed asset filenames, so caching it stale is what causes users to keep
  # seeing an old deploy after a rebuild.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://yookassa.ru; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' https://yookassa.ru; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://yookassa.ru; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' https://yookassa.ru; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
