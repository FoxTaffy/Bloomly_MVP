services:
  db:
    image: postgres:16-alpine
    restart: always
    shm_size: '256mb'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-bloomly}
      # Tune PostgreSQL for stability under load
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c maintenance_work_mem=32MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=8MB
        -c work_mem=4MB
        -c tcp_keepalives_idle=60
        -c tcp_keepalives_interval=10
        -c tcp_keepalives_count=5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bloomly}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./backend
    restart: always
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bloomly_secret_123}
      MINIO_BUCKET: bloomly
      MINIO_PUBLIC_URL: https://bloomly.fun/s3
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://bloomly.fun}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-https://bloomly.fun/api}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Bloomly <noreply@bloomly.fun>}
    command: sh -c "npx prisma migrate deploy && npm run start"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5173:3000"
    environment:
      - VITE_API_URL=https://bloomly.fun

  minio:
    image: minio/minio
    container_name: bloomly-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bloomly_secret_123}
      MINIO_BROWSER_REDIRECT_URL: https://bloomly.fun/minio-console
    command: server /data --console-address ":9001"
    restart: always

volumes:
  postgres_data:
  minio_data:
