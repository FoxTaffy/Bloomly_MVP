    <!-- ─── JSON-LD: WebSite ──────────────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",

      "description": "Bloomly — социальная сеть для художников, фурри-сообщества и всех творческих людей.",

        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://bloomly.fun/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Bloomly",
        "url": "https://bloomly.fun",
        "logo": {
          "@type": "ImageObject",
          "url": "https://bloomly.fun/bloomly.png"
        }

    }
