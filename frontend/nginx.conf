map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # Версия nginx не раскрывается в заголовках ответа.
  server_tokens off;

  # Заголовки повторяются в каждом location: nginx отменяет add_header уровня server,
  # если в location есть свой add_header.
  # script-src 'self' — единственная защита, которая не даёт выполнить javascript:-ссылку или
  # внедрённый скрипт, даже если где-то пропустили небезопасный href (defence in depth).
  # style-src 'unsafe-inline' нужен Vue (style=""), шрифты (Nunito) лежат в /fonts/ и отдаются с того же домена.

  # Hashed build assets (assets/*-<hash>.js/css/...) never change content under the
  # same filename — safe to cache "forever" on the client.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-elem 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # index.html must always be revalidated — it's the only thing that references the
  # current hashed asset filenames, so caching it stale is what causes users to keep
  # seeing an old deploy after a rebuild.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-elem 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Service worker должен всегда проверяться заново, иначе обновления доходят до пользователей с задержкой.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-elem 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # API и WebSocket (/api/) проксируются на бэкенд внутри compose-сети. Без этого локальный
  # доступ через 127.0.0.1:5173 отдавал 405 на запросы к /api. На проде /api обычно перехватывает
  # внешний прокси раньше, так что блок ему не мешает.
  # Загрузка файлов (фото, видео, вложения до 2 ГБ по тарифам). Тело стримится в бэкенд без буферизации в контейнере:
  # лимит тарифа проверяет сам бэкенд на лету и обрывает приём с 413. Только этот маршрут получает 2048m —
  # остальные API ограничены 100m ниже.
  location = /api/media/upload {
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2048m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_body_timeout 600s;
    send_timeout 600s;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    client_max_body_size 100m;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-elem 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
